version: '3.8'

networks:
  app-network:
    driver: bridge

services:
  product-service:
    build: ./product_service
    ports:
      - "5001:5001"
    networks:
      - app-network

  order-service:
    build: ./order_service
    ports:
      - "5002:5002"
    networks:
      - app-network
    depends_on:
      - product-service
      - payment-service

  payment-service:
    build: ./payment_service
    ports:
      - "5003:5003"
    networks:
      - app-network
